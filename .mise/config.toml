min_version = "2026.9.11"

[tools]
node = "26.9.0"
aube = "2.2.17"
git-cliff = "2.14.1"

# Built-in [deps.aube] requires aube-lock.yaml to exist, which this project
# will never have (aube reads/writes package-lock.json in place). A custom
# provider with explicit sources/outputs/run has no such precondition.
[deps.install]
auto = true
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/"]
run = "aube install"

[settings]
experimental = true

[settings.packslip]
exec = true

[settings.skills]
# Skills shipped by pinned tools are committed under .agents/tool-skills and
# rebuilt by `mise run tool:skills` when the toolchain changes; nothing is
# synced automatically, so an install never leaves machine-local links in the tree.
dir = ".agents/tool-skills"
auto_sync = false
prune = true
