<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Property Listings</title>
    <style>
      :root {
        --page-bg: #f8fafc;
        --page-surface: #ffffff;
        --page-border: #e2e8f0;
        --page-text: #0f172a;
        --page-muted: #475569;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--page-text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      .page-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }

      .host-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
        padding: 12px 16px;
        background: var(--page-surface);
        border: 1px solid var(--page-border);
        border-radius: 16px;
      }

      .host-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .host-logo {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #0f172a;
        color: #ffffff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .host-brand h1 {
        display: block;
        margin: 0;
        font-size: 1rem;
      }

      .host-brand span {
        display: block;
        color: var(--page-muted);
        font-size: 0.75rem;
      }

      .host-summary {
        color: var(--page-muted);
        font-size: 0.9rem;
      }

      .file-origin-notice {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #f59e0b;
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        font-size: 0.875rem;
      }

      html[data-file-origin] .file-origin-notice {
        display: block;
      }

      .host-main {
        background: var(--page-surface);
        border: 1px solid var(--page-border);
        border-radius: 18px;
        padding: clamp(16px, 2vw, 28px);
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="host-header" aria-label="Host page header">
        <div class="host-brand">
          <span class="host-logo">3D</span>
          <div>
            <h1>Property Listings</h1>
            <span>Available rentals</span>
          </div>
        </div>
        <div class="host-summary">
          Host page wrapper for the listings component ·
          <a href="./migration.html">Migration report</a>
        </div>
      </header>
      <p class="file-origin-notice" role="status">
        You opened this demo from the file system. The bundled component is running, but live feed
        requests require an HTTP(S) origin; use the project demo server for network validation.
      </p>

      <main class="host-main">
        <property-listings></property-listings>
      </main>
    </div>

    <script defer src="./dist/bundle.js"></script>
    <script>
      if (window.location.protocol === 'file:') {
        document.documentElement.dataset.fileOrigin = '';
      }
    </script>
  </body>
</html>
