    /**
     * Address Normalizer Service
     */
    class AddressNormalizer {
      static SECONDARY_DESIGNATORS = ['apt', 'apartment', 'unit', 'suite', 'ste', '#'];

      static normalize(rawAddress) {
        if (!rawAddress || typeof rawAddress !== 'string') {
          return { line1: '', line2: '' };
        }

        let clean = this.preprocess(rawAddress);

        if (clean.includes('\n')) {
          const parts = clean
            .split('\n')
            .map((p) => p.trim())
            .filter(Boolean);
          return { line1: parts[0] || '', line2: parts[1] || '' };
        }

        if (clean.includes('-')) {
          const dashParsed = this.parseDashSeparated(clean);
          if (dashParsed) return dashParsed;
        }

        const suffixMatch = clean.match(/^(\d+)\s*(½|[A-Za-z])\b\s+(.*)/i);
        if (suffixMatch) {
          return this.parseCivicSuffixAddress(suffixMatch);
        }

        return this.parseInlineUnit(clean);
      }

      static preprocess(raw) {
        return raw
          .trim()
          .replace(/\s+/g, ' ')
          .replace(/\b1\/2\b/g, '½')
          .replace(/([a-z0-9])(Apt|Unit|Ste|Suite|#)/gi, '$1 $2')
          .replace(/\bSt\.?\b/gi, 'Street')
          .replace(/\bAve\.?\b/gi, 'Avenue')
          .replace(/\bRd\.?\b/gi, 'Road')
          .replace(/\bDr\.?\b/gi, 'Drive')
          .replace(/\bBlvd\.?\b/gi, 'Boulevard');
      }

      static parseDashSeparated(clean) {
        const numericUnitMatch = clean.match(
          /^(?:(unit|apt|suite|ste|#)\s*)?(\d+[a-z]?)\s*-\s*(\d+\s+.*)$/i,
        );
        if (numericUnitMatch) {
          const rawUnit = numericUnitMatch[2].trim();
          const streetPart = numericUnitMatch[3].trim();
          const formattedUnit = this.hasSecondaryPrefix(rawUnit) ? rawUnit : `Unit ${rawUnit}`;

          return { line1: streetPart, line2: formattedUnit };
        }

        const prefixSuffixMatch = clean.match(
          /^(?:([a-z]|½)\s*-\s*(\d+)|(\d+)\s*-\s*([a-z]|½))\s+(.*)$/i,
        );
        if (prefixSuffixMatch) {
          const civicNum = prefixSuffixMatch[2] || prefixSuffixMatch[3];
          const suffix = (prefixSuffixMatch[1] || prefixSuffixMatch[4]).toUpperCase();
          const street = prefixSuffixMatch[5].trim();
          const formattedSuffix = suffix === '½' ? ' ½' : suffix;

          return { line1: `${civicNum}${formattedSuffix} ${street}`.trim(), line2: '' };
        }

        if (/\s+-\s+/.test(clean)) {
          const parts = clean.split(/\s+-\s+/).map((p) => p.trim());
          const streetPart = parts[0];
          const unitOrSuffix = parts[1] || '';

          if (/^[A-Za-z]$/.test(unitOrSuffix) || unitOrSuffix === '½') {
            const suffix = unitOrSuffix === '½' ? ' ½' : unitOrSuffix.toUpperCase();
            const line1 = streetPart.replace(/^(\d+)/, `$1${suffix}`);
            return { line1, line2: '' };
          }

          const formattedUnit = this.hasSecondaryPrefix(unitOrSuffix)
            ? unitOrSuffix
            : `Unit ${unitOrSuffix}`;
          return { line1: streetPart, line2: formattedUnit };
        }

        return null;
      }

      static parseCivicSuffixAddress(match) {
        const civicNum = match[1];
        const suffix = match[2].toUpperCase() === '½' ? ' ½' : match[2].toUpperCase();
        const restOfAddress = match[3];

        const designatorPattern = this.SECONDARY_DESIGNATORS.join('|');
        const inlineMatch = restOfAddress.match(
          new RegExp(`^(.*?)\\s*[\\, ]\\s*(${designatorPattern})\\b\\s*(.*)`, 'i'),
        );

        if (inlineMatch) {
          return {
            line1: `${civicNum}${suffix} ${inlineMatch[1]}`.trim(),
            line2: `${inlineMatch[2]} ${inlineMatch[3]}`.trim(),
          };
        }

        return { line1: `${civicNum}${suffix} ${restOfAddress}`.trim(), line2: '' };
      }

      static parseInlineUnit(clean) {
        const designatorPattern = this.SECONDARY_DESIGNATORS.join('|');
        const regex = new RegExp(`^(.*?)\\s*[\\, ]\\s*(${designatorPattern})\\b\\s*(.*)`, 'i');
        const match = clean.match(regex);

        if (match) {
          return {
            line1: match[1].trim(),
            line2: `${match[2].trim()} ${match[3].trim()}`.trim(),
          };
        }

        return { line1: clean, line2: '' };
      }

      static hasSecondaryPrefix(str) {
        const designatorPattern = this.SECONDARY_DESIGNATORS.join('|');
        return new RegExp(`^(${designatorPattern})`, 'i').test(str);
      }
    }

    /**
     * Location Resolver
     */
    class LocationResolver {
      constructor(regionMap) {
        this.regionMap = regionMap;
        this.fsaIndex = {};
        this.buildFsaIndex();
      }

      buildFsaIndex() {
        Object.entries(this.regionMap).forEach(([regionName, regionData]) => {
          regionData.localAreas.forEach((area) => {
            area.fsas.forEach((fsa) => {
              if (!this.fsaIndex[fsa]) this.fsaIndex[fsa] = [];
              this.fsaIndex[fsa].push({
                regionName,
                regionId: regionData.id,
                areaName: area.name,
              });
            });
          });
        });
      }

      resolve(city, postalCode) {
        const fsa = getFSA(postalCode);
        const matches = this.fsaIndex[fsa];

        if (matches && matches.length > 0) {
          if (matches.length === 1) return matches[0];
          if (city) {
            const cityLower = city.toLowerCase().trim();
            const cityMatch = matches.find((m) => m.areaName.toLowerCase().includes(cityLower));
            if (cityMatch) return cityMatch;
          }
          return matches[0];
        }

        if (city) {
          const cityLower = city.toLowerCase().trim();
          for (const [regionName, regionData] of Object.entries(this.regionMap)) {
            const matchedArea = regionData.localAreas.find((a) =>
              a.name.toLowerCase().includes(cityLower),
            );
            if (matchedArea) {
              return { regionName, regionId: regionData.id, areaName: matchedArea.name };
            }
          }
        }

        return { regionName: city || 'Other', regionId: 'OTHER', areaName: city || 'General' };
      }
    }

    /**
     * Listing Feed Parser
     */
    class ListingParser {
      static FEED_URL = 'https://3dmanagement.managebuilding.com/resident/api/public/listingFeeds';

      constructor(locationResolver) {
        this.locationResolver = locationResolver;
      }

      async fetchXml() {
        const proxies = [
          (url) => url,
          (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
          (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        ];

        for (const proxyFn of proxies) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);

          try {
            const response = await fetch(proxyFn(ListingParser.FEED_URL), {
              signal: controller.signal,
            });
            clearTimeout(timeoutId);
            if (!response.ok) continue;

            let payload = await response.text();
            if (payload.trim().startsWith('{') && payload.includes('"contents"')) {
              payload = JSON.parse(payload).contents;
            }

            if (payload && payload.includes('<Property>')) return payload;
          } catch (err) {
            clearTimeout(timeoutId);
            continue;
          }
        }
        throw new Error('Unable to retrieve XML feed.');
      }

      parse(xmlString) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
        const propertyNodes = xmlDoc.querySelectorAll('Property');

        return Array.from(propertyNodes)
          .map((node) => this.extractListingData(node))
          .filter(Boolean);
      }

      extractListingData(propertyNode) {
        const addressNode = propertyNode.querySelector('PropertyID > Address');
        const street = addressNode?.querySelector('Address')?.textContent || '';
        const unit = addressNode?.querySelector('Unit, UnitNumber')?.textContent || '';

        const rawCombined = unit ? `${street} ${unit}` : street;
        const normalizedAddress = AddressNormalizer.normalize(rawCombined);

        const city = addressNode?.querySelector('City')?.textContent.trim() || '';
        const postalCode = addressNode?.querySelector('PostalCode')?.textContent.trim() || '';

        const location = this.locationResolver.resolve(city, postalCode);

        const floorplanNode = propertyNode.querySelector('Floorplan');
        const id =
          floorplanNode?.querySelector('Identification > IDValue')?.textContent.trim() || '';

        const bedroomNode = floorplanNode?.querySelector('Room[RoomType="Bedroom"] > Count');
        const bedroomCount = bedroomNode ? parseFloat(bedroomNode.textContent.trim()) : 0;

        const bathroomNode = floorplanNode?.querySelector('Room[RoomType="Bathroom"] > Count');
        const bathroomCount = bathroomNode ? parseFloat(bathroomNode.textContent.trim()) : null;

        const rentMaxAttr = floorplanNode?.querySelector('EffectiveRent')?.getAttribute('Max');
        const rent = rentMaxAttr ? Math.round(parseFloat(rentMaxAttr)) : null;

        const fileNodes = Array.from(floorplanNode?.querySelectorAll('File') || []);
        const rank1File = fileNodes.find(
          (file) => file.querySelector('Rank')?.textContent.trim() === '1',
        );
        const primaryImage = rank1File?.querySelector('Src')?.textContent.trim() || '';

        const rawDesc =
          propertyNode.querySelector('Information > LongDescription')?.textContent || '';
        const hook =
          rawDesc
            .split('\n')
            .map((l) => l.trim())
            .find((l) => l.length > 0) || '';

        return {
          id,
          address: {
            line1: normalizedAddress.line1,
            line2: normalizedAddress.line2,
            city,
            postalCode,
            fsa: getFSA(postalCode),
            regionId: location.regionId,
            regionName: location.regionName,
            areaName: location.areaName,
          },
          bedroomCount,
          bathroomCount,
          rent,
          primaryImage,
          hook,
        };
      }
    }

    /**
     * Modal Dialog Component
     */
    class PropertyDialog {
      constructor() {
        this.dialog = null;
        this.iframe = null;
        this.titleEl = null;
        this.closeBtn = null;
        this.lastFocusedElement = null;
      }

      mount() {
        if (this.dialog) return;

        this.dialog = document.createElement('dialog');
        this.dialog.className = 'sc-property-dialog';
        this.dialog.setAttribute('aria-label', 'Property Details Modal');

        this.dialog.innerHTML = `
        <div class="sc-dialog-layout">
          <div class="sc-dialog-header">
            <h3 class="sc-dialog-title">Property Details</h3>
            <button type="button" class="sc-dialog-close" aria-label="Close dialog">&times;</button>
          </div>
          <iframe class="sc-dialog-iframe" allowfullscreen title="Property listing detail view"></iframe>
        </div>
      `;

        this.titleEl = this.dialog.querySelector('.sc-dialog-title');
        this.iframe = this.dialog.querySelector('.sc-dialog-iframe');
        this.closeBtn = this.dialog.querySelector('.sc-dialog-close');

        this.bindEvents();
        document.body.appendChild(this.dialog);
      }

      bindEvents() {
        this.dialog.addEventListener('close', () => {
          this.iframe.src = 'about:blank';
          if (this.lastFocusedElement) this.lastFocusedElement.focus();
        });

        this.dialog.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            const focusables = this.dialog.querySelectorAll('button, iframe');
            const first = focusables[0];
            const last = focusables[focusables.length - 1];

            if (e.shiftKey && document.activeElement === first) {
              last.focus();
              e.preventDefault();
            } else if (!e.shiftKey && document.activeElement === last) {
              first.focus();
              e.preventDefault();
            }
          }
        });

        this.closeBtn.addEventListener('click', () => this.dialog.close());
        this.dialog.addEventListener('click', (e) => {
          if (e.target === this.dialog) this.dialog.close();
        });
      }

      open(rawUrl, titleText) {
        this.mount();
        this.lastFocusedElement = document.activeElement;

        const url = new URL(rawUrl, window.location.href);
        url.searchParams.set('hidenav', 'true');

        if (this.titleEl) this.titleEl.textContent = titleText || 'Property Details';
        this.iframe.src = url.toString();
        this.dialog.showModal();
        this.closeBtn.focus();
      }
    }

    /**
     * Filter State & UI Controller
     */
    class ListingFilter {
      constructor(selectors) {
        this.selectors = selectors;
        this.dom = {};
        this.listingsStore = [];
        this.debounceTimer = null;
      }

      init() {
        Object.entries(this.selectors).forEach(([key, selector]) => {
          this.dom[key] = document.querySelector(selector);
        });
        this.bindEvents();
      }

      setListings(items) {
        this.listingsStore = items.map((item) => ({
          data: item,
          element: CardTemplate.render(item),
        }));
        this.populateLocations(items);
        this.setupPriceBounds(items);
        this.applyFilters();
      }

      populateLocations(items) {
        if (!this.dom.locationSelect) return;

        const areaCounts = {};
        const regionCounts = {};

        items.forEach((item) => {
          const rId = item.address.regionId;
          const key = `${rId}||${item.address.areaName}`;
          areaCounts[key] = (areaCounts[key] || 0) + 1;
          regionCounts[rId] = (regionCounts[rId] || 0) + 1;
        });

        const fragment = document.createDocumentFragment();
        const defaultOption = document.createElement('option');
        defaultOption.value = 'ALL';
        defaultOption.textContent = `All Locations (${items.length})`;
        fragment.appendChild(defaultOption);

        Object.entries(NEW_BRUNSWICK_REGIONS).forEach(([regionName, regionData]) => {
          const cleanedName = cleanRegionName(regionName);
          const activeSubAreas = [];

          regionData.localAreas.forEach((area) => {
            const key = `${regionData.id}||${area.name}`;
            const count = areaCounts[key] || 0;
            if (count > 0) activeSubAreas.push({ key, name: area.name, count });
          });

          if (activeSubAreas.length > 0) {
            const group = document.createElement('optgroup');
            group.label = cleanedName;

            if (activeSubAreas.length > 1) {
              const regTotal = regionCounts[regionData.id] || 0;
              const allRegionOpt = document.createElement('option');
              allRegionOpt.value = `${regionData.id}||ALL`;
              allRegionOpt.textContent = `All ${cleanedName} (${regTotal})`;
              group.appendChild(allRegionOpt);
            }

            activeSubAreas.forEach((area) => {
              const option = document.createElement('option');
              option.value = area.key;
              option.textContent = `${area.name} (${area.count})`;
              group.appendChild(option);
            });

            fragment.appendChild(group);
          }
        });

        this.dom.locationSelect.innerHTML = '';
        this.dom.locationSelect.appendChild(fragment);
        this.dom.locationSelect.value = 'ALL';
      }

      setupPriceBounds(items) {
        if (!this.dom.priceInput) return;
        const rents = items.map((item) => item.rent).filter((rent) => rent !== null && rent > 0);

        if (rents.length > 0) {
          const rawMin = Math.min(...rents);
          const rawMax = Math.max(...rents);

          const minRent = Math.floor(rawMin / 100) * 100;
          const maxRent = Math.ceil(rawMax / 100) * 100;

          this.dom.priceInput.min = minRent;
          this.dom.priceInput.max = maxRent;
          this.dom.priceInput.step = 100;
          this.dom.priceInput.value = maxRent;
          this.updatePriceLabel(maxRent);
        }
      }

      updatePriceLabel(val) {
        if (this.dom.priceDisplay) {
          this.dom.priceDisplay.textContent = `Up to $${parseInt(val, 10).toLocaleString()} / mo`;
        }
      }

      resetFilters() {
        if (this.dom.locationSelect) this.dom.locationSelect.value = 'ALL';
        if (this.dom.bedSelect) this.dom.bedSelect.value = '>=0';
        if (this.dom.sortSelect) this.dom.sortSelect.value = 'default';
        if (this.dom.priceInput) {
          this.dom.priceInput.value = this.dom.priceInput.max;
          this.updatePriceLabel(this.dom.priceInput.max);
        }
        this.applyFilters();
      }

      bindEvents() {
        if (this.dom.locationSelect)
          this.dom.locationSelect.addEventListener('change', () => this.applyFilters());
        if (this.dom.bedSelect)
          this.dom.bedSelect.addEventListener('change', () => this.applyFilters());
        if (this.dom.sortSelect)
          this.dom.sortSelect.addEventListener('change', () => this.applyFilters());
        if (this.dom.resetBtn)
          this.dom.resetBtn.addEventListener('click', () => this.resetFilters());

        if (this.dom.priceInput) {
          this.dom.priceInput.addEventListener('input', (e) => {
            this.updatePriceLabel(e.target.value);
            clearTimeout(this.debounceTimer);
            this.debounceTimer = setTimeout(() => this.applyFilters(), 150);
          });
        }
      }

      applyFilters() {
        const selectedLocation = this.dom.locationSelect ? this.dom.locationSelect.value : 'ALL';
        const selectedBedRule = this.dom.bedSelect ? this.dom.bedSelect.value : '>=0';
        const sortRule = this.dom.sortSelect ? this.dom.sortSelect.value : 'default';
        const maxRent = this.dom.priceInput ? parseInt(this.dom.priceInput.value, 10) : Infinity;

        let selRegionId = 'ALL';
        let selAreaName = 'ALL';

        if (selectedLocation !== 'ALL') {
          const parts = selectedLocation.split('||');
          selRegionId = parts[0];
          selAreaName = parts[1];
        }

        let visibleItems = this.listingsStore.filter(({ data }) => {
          let matchesLocation = false;
          if (selectedLocation === 'ALL') {
            matchesLocation = true;
          } else if (selAreaName === 'ALL') {
            matchesLocation = data.address.regionId === selRegionId;
          } else {
            matchesLocation =
              data.address.regionId === selRegionId &&
              data.address.areaName.toLowerCase() === selAreaName.toLowerCase();
          }

          let matchesBeds = false;
          switch (selectedBedRule) {
            case '=0':
              matchesBeds = data.bedroomCount === 0;
              break;
            case '=1':
              matchesBeds = data.bedroomCount === 1;
              break;
            case '=2':
              matchesBeds = data.bedroomCount === 2;
              break;
            case '>=3':
              matchesBeds = data.bedroomCount >= 3;
              break;
            case '>=0':
            default:
              matchesBeds = data.bedroomCount >= 0;
              break;
          }

          const matchesPrice = data.rent === null || data.rent === 0 || data.rent <= maxRent;
          return matchesLocation && matchesBeds && matchesPrice;
        });

        if (sortRule !== 'default') {
          visibleItems.sort((a, b) => {
            const rentA = a.data.rent || 0;
            const rentB = b.data.rent || 0;
            const bedsA = a.data.bedroomCount || 0;
            const bedsB = b.data.bedroomCount || 0;

            if (sortRule === 'price-asc') return rentA - rentB;
            if (sortRule === 'price-desc') return rentB - rentA;
            if (sortRule === 'beds-asc') return bedsA - bedsB;
            if (sortRule === 'beds-desc') return bedsB - bedsA;
            return 0;
          });
        }

        this.dom.container.innerHTML = '';
        if (visibleItems.length > 0) {
          const fragment = document.createDocumentFragment();
          visibleItems.forEach((item) => fragment.appendChild(item.element));
          this.dom.container.appendChild(fragment);
        } else {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'sc-empty-state';
          emptyMsg.setAttribute('role', 'status');
          emptyMsg.innerHTML = `
          <p>No available listings match your selected criteria right now.</p>
          <div class="sc-empty-actions">
            <button type="button" class="sc-btn-reset" onclick="document.querySelector('#sc-reset-filters').click()">Clear Filters</button>
            <a href="${BUILDIUM_APPLICATION_URL}" target="_blank" rel="noopener noreferrer" class="sc-btn-buildium">Apply Online Now &rarr;</a>
          </div>
        `;
          this.dom.container.appendChild(emptyMsg);
        }

        if (this.dom.resultsBar) {
          this.dom.resultsBar.innerHTML = `<span>Showing <strong>${visibleItems.length}</strong> available listing${visibleItems.length !== 1 ? 's' : ''}</span>`;
        }
      }
    }

    /**
     * Main Application Bootstrapper
     */
    class ListingApp {
      constructor() {
        this.locationResolver = new LocationResolver(NEW_BRUNSWICK_REGIONS);
        this.parser = new ListingParser(this.locationResolver);
        this.dialog = new PropertyDialog();

        this.filterManager = new ListingFilter({
          locationSelect: '#sc-location-filter',
          bedSelect: '#sc-bedroom-filter',
          sortSelect: '#sc-sort-filter',
          priceInput: '#sc-price-filter',
          priceDisplay: '#sc-price-val',
          resetBtn: '#sc-reset-filters',
          container: '#sc-listings-container',
          resultsBar: '#sc-results-bar',
        });
      }

      async init() {
        const container = document.querySelector('#sc-listings-container');
        if (!container) return;

        this.filterManager.init();
        container.innerHTML = CardTemplate.renderSkeleton();
        this.attachEvents();

        try {
          const xmlString = await this.parser.fetchXml();
          const listings = this.parser.parse(xmlString);
          this.filterManager.setListings(listings);
        } catch (error) {
          console.error('Sitecloud Listing Embed Error:', error);
          container.innerHTML =
            '<div class="sc-empty-state" role="alert"><p>Unable to load listings at this time.</p></div>';
        }
      }

      attachEvents() {
        const self = this;
        document.addEventListener('click', (e) => {
          const anchor = e.target.closest('article.property a');
          if (!anchor || isMobileViewport()) return;

          e.preventDefault();
          const card = anchor.closest('article.property');
          const line1 = card?.querySelector('.address-line-1')?.textContent.trim() || '';
          const line2 = card?.querySelector('.address-line-2')?.textContent.trim() || '';
          const fullTitle = `${line1} ${line2}`.trim() || 'Property Details';

          self.dialog.open(anchor.href, fullTitle);
        });
      }
    }

    // Self-initializing bootstrap execution
    const boot = () => new ListingApp().init();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
