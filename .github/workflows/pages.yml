name: Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Branch pushes only refresh previews; production dist always builds from main.
          ref: main
      - name: Set up mise
        uses: jdx/mise-action@v5
      - name: Build production bundle
        run: mise run build
      - name: Build branch previews
        run: mise run preview:publish
      - name: Prune stale previews
        run: mise run preview:prune
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
