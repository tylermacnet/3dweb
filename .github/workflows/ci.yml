name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up mise
        uses: jdx/mise-action@v2
      - name: Trust mise config
        run: mise trust
      - name: Run checks and build
        run: mise run check
