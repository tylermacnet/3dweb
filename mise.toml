[tools]
node = "latest"

[tasks.build]
description = "Bundle the web component and its CSS"
run = "npm exec -- esbuild src/index.tsx --bundle --format=iife --target=es2022 --loader:.css=text --sourcemap --outfile=public/dist/bundle.js"

[tasks.watch]
description = "Watch source files and rebuild the bundle"
run = "npm exec -- esbuild src/index.tsx --bundle --format=iife --target=es2022 --loader:.css=text --sourcemap --outfile=public/dist/bundle.js --watch"

[tasks.serve]
description = "Serve the public directory locally"
run = "npm exec -- esbuild src/index.tsx --bundle --format=iife --target=es2022 --loader:.css=text --sourcemap --outfile=public/dist/bundle.js --servedir=public --serve=localhost:8000"

[tasks.dev]
description = "Build, watch, and serve the website locally"
run = "npm exec -- esbuild src/index.tsx --bundle --format=iife --target=es2022 --loader:.css=text --sourcemap --outfile=public/dist/bundle.js --servedir=public --serve=localhost:8000 --watch"

[tasks.format]
description = "Format selected files or the repository"
usage = 'arg "[files]..." default="." help="Files or directories to format (default: .)"'
run = "npm exec -- prettier --write {{ usage.files | join(sep=' ') }}"

[tasks.format-check]
description = "Check selected files or the repository"
usage = 'arg "[files]..." default="." help="Files or directories to check (default: .)"'
run = "npm exec -- prettier --check {{ usage.files | join(sep=' ') }}"

[tasks.lint]
description = "Lint selected files or the repository"
usage = 'arg "[files]..." default="." help="Files or directories to lint (default: .)"'
run = "npm exec -- oxlint {{ usage.files | join(sep=' ') }}"

[tasks.typecheck]
description = "Type-check the project"
run = "npm exec -- tsc --noEmit"

[tasks.test]
description = "Run unit and integration tests"
depends = ["test-unit", "test-integration"]

[tasks.test-unit]
description = "Run selected unit tests or all unit tests"
usage = 'arg "[files]..." default="test/unit" help="Unit test files or directories (default: test/unit)"'
run = "node --test {{ usage.files | join(sep=' ') }}"

[tasks.test-integration]
description = "Run selected integration tests or all integration tests"
usage = 'arg "[files]..." default="test/integration" help="Integration test files or directories (default: test/integration)"'
run = "node --test {{ usage.files | join(sep=' ') }}"

[tasks.check]
description = "Run all checks and create a production bundle"
depends = ["format-check", "lint", "typecheck", "test", "build"]
